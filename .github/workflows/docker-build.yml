name: Build and Push Docker Image

on:
  push:
    branches:
      - feat/direct-thirdparty-reading
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - feat/direct-thirdparty-reading
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/morggna/legado-hub

jobs:
  build:
    if: github.repository == 'morggna/legado-hub'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag policy:
      #   feat/direct-thirdparty-reading (default branch) -> latest + sha-*
      #   main                                            -> beta + sha-*
      #   tag v*                                          -> vX.Y.Z + latest + sha-*
      #   pull_request                                    -> build only, no push
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/feat/direct-thirdparty-reading' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Legado Hub (Personal Fork)
            org.opencontainers.image.description=LegadoHub personal reading fork with account login, private shelves, and immersive reader
            org.opencontainers.image.source=https://github.com/morggna/legado-hub

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Build and push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ env.DOCKER_IMAGE }}@${{ steps.push.outputs.digest }}"
          echo "tags=${{ steps.meta.outputs.tags }}"

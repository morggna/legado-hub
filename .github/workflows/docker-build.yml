name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: xzixmn/legado-hub

jobs:
  build:
    # The inherited publisher belongs to upstream's Docker Hub account.
    if: github.repository == 'XziXmn/legado-hub'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag policy (two channels):
      #   main  / workflow_dispatch on branch → beta + sha-*   (dev/test only)
      #   tag v*                             → vX.Y.Z + latest + sha-*  (formal)
      #   pull_request                       → build only, no push
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Legado Hub
            org.opencontainers.image.description=Local-first Legado reading and source management service
            org.opencontainers.image.source=https://github.com/XziXmn/legado-hub

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: xzixmn
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Build and push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ env.DOCKER_IMAGE }}@${{ steps.push.outputs.digest }}"
          echo "tags=${{ steps.meta.outputs.tags }}"

services:
  app:
    image: local/legadohub-direct:20261007
    container_name: legadohub-direct
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: '1000'
      PGID: '1000'
      LEGADOHUB_ALLOWED_HOSTS: book.uclau.de,127.0.0.1,localhost
      LEGADOHUB_ALLOWED_ORIGINS: https://book.uclau.de,http://127.0.0.1:8765
      LEGADOHUB_TRUSTED_PROXIES: 127.0.0.1/32,192.168.224.1/32
      LEGADOHUB_AUTH_MODE: account_invite
    command: [python, -m, uvicorn, 'app.main:app', --host, 0.0.0.0, --port, '8765', --proxy-headers, --forwarded-allow-ips, '127.0.0.1,192.168.224.1']
    ports:
      - '127.0.0.1:8765:8765'
    volumes:
      - ./data:/app/backend/data
      - ./config:/app/backend/config
      - ./generated:/app/backend/generated
      - ./runtime:/app/backend/runtime
      - ./plugins/thirdparty:/app/plugins/sources/thirdparty
      - ./plugins/official:/app/plugins/sources/official
    networks: [reader]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/api/auth/entrypoint",timeout=5)']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  reader:
    ipam:
      config:
        - subnet: 192.168.224.0/24

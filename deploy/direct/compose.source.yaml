# Build the fork from source; no upstream/latest image is substituted.
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: legadohub-personal:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Asia/Shanghai}'
      LEGADOHUB_AUTH_MODE: account_invite
      LEGADOHUB_ALLOWED_HOSTS: '${LEGADOHUB_ALLOWED_HOSTS:-127.0.0.1,localhost}'
      LEGADOHUB_ALLOWED_ORIGINS: '${LEGADOHUB_ALLOWED_ORIGINS:-http://127.0.0.1:8765,http://localhost:8765}'
      LEGADOHUB_TRUSTED_PROXIES: '${LEGADOHUB_TRUSTED_PROXIES:-127.0.0.1/32}'
    command: [python, -m, uvicorn, 'app.main:app', --host, 0.0.0.0, --port, '8765']
    ports:
      - '127.0.0.1:8765:8765'
    volumes:
      - ./state/data:/app/backend/data
      - ./state/config:/app/backend/config
      - ./state/generated:/app/backend/generated
      - ./state/runtime:/app/backend/runtime
      - ./state/plugins/thirdparty:/app/plugins/sources/thirdparty
      - ./state/plugins/official:/app/plugins/sources/official
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/api/auth/entrypoint",timeout=5)']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
